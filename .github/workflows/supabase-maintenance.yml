name: Supabase keep-alive and backup

on:
  schedule:
    - cron: '17 3 */3 * *'   # every 3 days, keep-alive
    - cron: '41 2 * * 5'     # Fridays, backup
  workflow_dispatch:

jobs:
  keepalive:
    if: github.event.schedule != '41 2 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/posts?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered $code"
          test "$code" = "200"

  backup:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 2 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Install the Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump the blog tables (posts, authors, view counts)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -Fc -f blog.dump

      - name: Encrypt the dump
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "blog-$(date +%F).dump.gpg" blog.dump
          rm blog.dump

      - uses: actions/upload-artifact@v4
        with:
          name: blog-backup-${{ github.run_number }}
          path: '*.dump.gpg'
          retention-days: 90
